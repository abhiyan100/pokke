<g clip-path='url(#m)'><rect x='44' y='299' width='712' height='579' fill='#F7F9F9'/><text x='80' y='361' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'>You are a senior product designer</text><text x='80' y='402' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'>reviewing my screen. Three passes:</text><text x='80' y='443' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'></text><text x='80' y='484' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'>1. Hierarchy: what the eye hits</text><text x='80' y='525' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'>   first, second, third.</text><text x='80' y='566' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'>2. Friction: every place a new</text><text x='80' y='607' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'>   user would hesitate.</text><text x='80' y='648' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'>3. Voice: copy that sounds like</text><text x='80' y='689' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'>   a template.</text><text x='80' y='730' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'></text><text x='80' y='771' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#0F1419'>One-line fix for each. No praise.</text><text x='80' y='812' font-family='SF Mono, Menlo, Consolas, monospace' font-size='24.5' fill='#1D9BF0'>[attach screenshot]</text></g>

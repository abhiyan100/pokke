<g font-family='SF Mono, Menlo, Consolas, monospace' font-size="21" fill="#0F1419"><text x="88" y="270">You are a senior product designer reviewing my screen.</text><text x="88" y="306">Critique it in three passes:</text><text x="88" y="354">1. Hierarchy: what does the eye hit first, second, third?</text><text x="88" y="390">2. Friction: every place a new user would hesitate.</text><text x="88" y="426">3. Voice: copy that sounds like a template.</text><text x="88" y="474">For each issue give the fix as a one-line change.</text><text x="88" y="510">Do not praise. Rank issues by impact.</text><text x="88" y="546" fill="#536471">Screen: [attach screenshot]</text></g>

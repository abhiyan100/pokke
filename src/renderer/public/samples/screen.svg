<rect x="452" y="648" width="452" height="188" rx="14" fill="#F7F9F9" stroke="#E1E8ED" stroke-width="1.5"/><g font-family='SF Mono, Menlo, Consolas, monospace' font-size="12.5" fill="#0F1419"><text x="470" y="678">You are a senior product designer reviewing my screen.</text><text x="470" y="700">Critique it in three passes:</text><text x="470" y="728">1. Hierarchy: what does the eye hit first, second, third?</text><text x="470" y="750">2. Friction: every place a new user would hesitate.</text><text x="470" y="772">3. Voice: copy that sounds like a template.</text><text x="470" y="800">For each issue give the fix as a one-line change.</text><text x="470" y="822">Do not praise. Rank issues by impact.</text></g></g>

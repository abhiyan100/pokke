<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820">
<rect width="1100" height="820" fill="#161821"/><rect width="1100" height="54" fill="#1E2030"/>
<circle cx="30" cy="27" r="7" fill="#FF5F57"/><circle cx="54" cy="27" r="7" fill="#FEBC2E"/><circle cx="78" cy="27" r="7" fill="#28C840"/><text x="470" y="34" font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size="16" fill="#8087A2">release-notes.prompt.md</text>
<g font-family='SF Mono, Menlo, Consolas, monospace' font-size="20"><text x="56" y="116" fill="#EEBE77" font-weight="700"># Role</text><text x="56" y="152" fill="#CAD3F5">You write release notes for a design tool used by</text><text x="56" y="184" fill="#CAD3F5">working designers. They skim. They distrust hype.</text>
<text x="56" y="244" fill="#EEBE77" font-weight="700"># Input</text><text x="56" y="280" fill="#CAD3F5">A list of merged pull requests with titles and labels.</text>
<text x="56" y="340" fill="#EEBE77" font-weight="700"># Output</text><text x="56" y="376" fill="#CAD3F5">- One headline of at most seven words.</text><text x="56" y="408" fill="#CAD3F5">- Up to five bullets, most useful change first.</text><text x="56" y="440" fill="#CAD3F5">- Each bullet starts with what the user can now do.</text><text x="56" y="472" fill="#CAD3F5">- No adjectives that could apply to any product.</text>
<text x="56" y="532" fill="#EEBE77" font-weight="700"># Rules</text><text x="56" y="568" fill="#CAD3F5">Skip refactors and dependency bumps entirely.</text><text x="56" y="600" fill="#CAD3F5">If a fix closes a bug users reported, say which.</text><text x="56" y="632" fill="#CAD3F5">Never promise a date.</text>
<text x="56" y="692" fill="#8AADF4">{{pull_requests}}</text></g>
<g font-family='SF Mono, Menlo, Consolas, monospace' font-size="18" fill="#494D64"><text x="18" y="116">1</text><text x="18" y="244">5</text><text x="18" y="340">8</text><text x="12" y="532">14</text><text x="12" y="692">19</text></g>
</svg>
